[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.codespell]
# MOSE is a dataset; the other spellings are serialized model/click attributes.
ignore-words-list = ["MOSE", "concurent", "indx"]

[tool.pytest.ini_options]
testpaths = ["cutie", "tests"]
addopts = [
  "--color=yes",
  "--doctest-modules",
]

[tool.ruff.lint]
# Ruff-only baseline. `PL` enables Ruff's Pylint-origin rules; explicit codes
# cover reviewed Pylint equivalents outside that family.
select = [
  "A",
  "ARG",
  "B",
  "E",
  "F",
  "G",
  "I",
  "PL",
  "RET",
  "SIM",
  "UP",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"cutie/**/*.py" = [
  "A001",
  "ARG002",
  "E721",
  "F401",
  "F403",
  "F405",
  "F541",
  "F821",
  "G004",
  "I001",
  "PLR0402",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "PLW2901",
  "RET505",
  "UP008",
  "UP032",
]
"gui/**/*.py" = [
  "A001",
  "ARG002",
  "F401",
  "F403",
  "F405",
  "F541",
  "F821",
  "G004",
  "I001",
  "PLR0402",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR1722",
  "PLR2004",
  "PLW2901",
  "RET505",
  "UP004",
  "UP008",
  "UP032",
]
"scripts/**/*.py" = ["F401", "F541", "I001", "PLR0912", "PLR0915", "PLR1722"]
"examples/**/*.py" = ["G004", "I001", "PLR2004"]
"tests/**/*.py" = ["I001", "PLR2004"]

[project]
name = "rf-cutie"
version = "1.0.1"
authors = [{ name = "Rex Cheng", email = "hkchengrex@gmail.com" }]
maintainers = [{ name = "Roboflow", email = "help@roboflow.com" }]
description = "Cutie: a video object segmentation framework (Roboflow-maintained fork for reliable packaging and PyPI releases)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "video-object-segmentation",
  "computer-vision",
  "deep-learning",
  "pytorch",
  "segmentation",
  "cutie",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  'torch',
  'numpy >= 1.21',
  'einops >= 0.6',
  'omegaconf >= 2.3',
]

[project.optional-dependencies]
inference = [
  'hydra-core >= 1.3.2',
  'Pillow >= 9.5',
  'torchvision',
  'requests',
  'tqdm >= 4.66.1',
]
evaluation = [
  'hydra-core >= 1.3.2',
  'Pillow >= 9.5',
  'torchvision',
  'tqdm >= 4.66.1',
  'pycocotools >= 2.0.7',
  'hickle >= 5.0',
]
train = [
  'gitpython >= 3.1',
  'thin-plate-spline >= 1.2.2',
  'tensorboard >= 2.11',
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'hydra-core >= 1.3.2',
  'torchvision',
]
gui = [
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'scipy >= 1.7',
  'tqdm >= 4.66.1',
  'hydra-core >= 1.3.2',
  'PySide6 >= 6.2.0',
  'av >= 0.5.2',
  'requests',
  'torchvision',
]
video = [
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'hydra-core >= 1.3.2',
  'pycocotools >= 2.0.7',
  'tqdm >= 4.66.1',
]
data = [
  'Pillow >= 9.5',
  'pycocotools >= 2.0.7',
  'tqdm >= 4.66.1',
  'hickle >= 5.0',
]

[dependency-groups]
build = [
  'build>=1.2',
  'cython',
  'twine>=6.0',
]
tests = [
  'coverage==7.13.2',
  'pytest==9.1.1',
  'tomli>=2.0; python_version < "3.11"',
]

[tool.uv.dependency-groups]
tests = { requires-python = '>=3.10' }

[tool.setuptools.packages.find]
where = ["."]
include = ["cutie*"]
namespaces = true

[tool.setuptools.package-data]
"cutie" = ["config/**/*.yaml", "utils/subsets/*.txt"]

[project.urls]
"Homepage" = "https://github.com/roboflow/rf-Cutie"
"Source" = "https://github.com/roboflow/rf-Cutie"
"Repository" = "https://github.com/roboflow/rf-Cutie.git"
"Issues" = "https://github.com/roboflow/rf-Cutie/issues"
"Bug Tracker" = "https://github.com/roboflow/rf-Cutie/issues"
"Changelog" = "https://github.com/roboflow/rf-Cutie/releases"
"Upstream Project" = "https://github.com/hkchengrex/Cutie"
"Paper" = "https://arxiv.org/abs/2310.12982"
