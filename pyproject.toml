[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Ruff-only baseline. `PL` enables Ruff's Pylint-origin rules; explicit codes
# cover reviewed Pylint equivalents outside that family.
select = [
  "A001", "A002", "A003", "A004",
  "ARG001", "ARG002", "ARG003", "ARG004", "ARG005",
  "B006", "B018",
  "E402", "E501", "E721", "E722",
  "F",
  "G001", "G002", "G004",
  "I001",
  "PL",
  "RET505", "RET506", "RET508",
  "SIM113", "SIM118",
  "UP004", "UP008", "UP032", "UP034",
]
ignore = [
  # Direct equivalents for disabled Pylint rules.
  "A001", "A002", "A003", "A004",
  "ARG001", "ARG002", "ARG003", "ARG004", "ARG005",
  "B006", "B018",
  "E402", "E501", "E721", "E722",
  "F401", "F403", "F405", "F541", "F821", "F823", "F841",
  "G001", "G002", "G004",
  "I001",
  "PLR0402", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917",
  "PLR1714", "PLR1722",
  "RET505", "RET506", "RET508",
  "SIM113", "SIM118",
  "UP004", "UP008", "UP032", "UP034",
  # Ruff Pylint extensions not enabled by the existing Pylint baseline.
  "PLR2004", "PLW1514", "PLW2901",
]

[project]
name = "rf-cutie"
version = "1.0.0.rc0"
authors = [{ name = "Rex Cheng", email = "hkchengrex@gmail.com" }]
description = ""
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'torch',
  'numpy >= 1.21',
  'einops >= 0.6',
  'omegaconf >= 2.3',
]

[project.optional-dependencies]
inference = [
  'hydra-core >= 1.3.2',
  'Pillow >= 9.5',
  'torchvision',
  'requests',
  'tqdm >= 4.66.1',
]
evaluation = [
  'hydra-core >= 1.3.2',
  'Pillow >= 9.5',
  'torchvision',
  'tqdm >= 4.66.1',
  'pycocotools >= 2.0.7',
  'hickle >= 5.0',
]
train = [
  'gitpython >= 3.1',
  'thinplate@git+https://github.com/cheind/py-thin-plate-spline',
  'tensorboard >= 2.11',
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'hydra-core >= 1.3.2',
  'torchvision',
]
gui = [
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'scipy >= 1.7',
  'tqdm >= 4.66.1',
  'hydra-core >= 1.3.2',
  'PySide6 >= 6.2.0',
  'easydict',
  'av >= 0.5.2',
  'requests',
  'pyqtdarktheme',
  'torchvision',
]
video = [
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'hydra-core >= 1.3.2',
  'pycocotools >= 2.0.7',
  'tqdm >= 4.66.1',
]
data = [
  'Pillow >= 9.5',
  'pycocotools >= 2.0.7',
  'tqdm >= 4.66.1',
  'hickle >= 5.0',
]

[dependency-groups]
build = [
  'build>=1.2',
  'cython',
  'twine>=6.0',
]
tests = [
  'coverage==7.13.2',
  'pytest==9.1.1',
  'tomli>=2.0; python_version < "3.11"',
]

[tool.uv.dependency-groups]
tests = { requires-python = '>=3.10' }

[tool.setuptools.packages.find]
where = ["."]
include = ["cutie*"]
namespaces = true

[tool.setuptools.package-data]
"cutie" = ["config/**/*.yaml", "utils/subsets/*.txt"]

[project.urls]
"Homepage" = "https://github.com/hkchengrex/Cutie"
"Bug Tracker" = "https://github.com/hkchengrex/Cutie/issues"
