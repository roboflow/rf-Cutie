[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 100

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Ruff-only baseline. `PL` enables Ruff's Pylint-origin rules; explicit codes
# cover reviewed Pylint equivalents outside that family.
select = [
  "A001", "A002", "A003", "A004",
  "ARG001", "ARG002", "ARG003", "ARG004", "ARG005",
  "B006", "B018",
  "E402", "E501", "E721", "E722",
  "F",
  "G001", "G002", "G004",
  "I001",
  "PL",
  "RET505", "RET506", "RET508",
  "SIM113", "SIM118",
  "UP004", "UP008", "UP032", "UP034",
]
ignore = [
  # Direct equivalents for disabled Pylint rules.
  "A001", "A002", "A003", "A004",
  "ARG001", "ARG002", "ARG003", "ARG004", "ARG005",
  "B006", "B018",
  "E402", "E501", "E721", "E722",
  "F401", "F403", "F405", "F541", "F821", "F823", "F841",
  "G001", "G002", "G004",
  "I001",
  "PLR0402", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917",
  "PLR1714", "PLR1722",
  "RET505", "RET506", "RET508",
  "SIM113", "SIM118",
  "UP004", "UP008", "UP032", "UP034",
  # Ruff Pylint extensions not enabled by the existing Pylint baseline.
  "PLR2004", "PLW1514", "PLW2901",
]

[project]
name = "cutie"
version = "1.0.0"
authors = [{ name = "Rex Cheng", email = "hkchengrex@gmail.com" }]
description = ""
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'cython',
  'gitpython >= 3.1',
  'thinplate@git+https://github.com/cheind/py-thin-plate-spline',
  'hickle >= 5.0',
  'tensorboard >= 2.11',
  'numpy >= 1.21',
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'scipy >= 1.7',
  'pycocotools >= 2.0.7',
  'tqdm >= 4.66.1',
  'gradio >= 3.34',
  'gdown >= 4.7.1',
  'einops >= 0.6',
  'hydra-core >= 1.3.2',
  'PySide6 >= 6.2.0',
  'charset-normalizer >= 3.1.0',
  'netifaces >= 0.11.0',
  'cchardet >= 2.1.7',
  'easydict',
  'av >= 0.5.2',
  'requests',
  'pyqtdarktheme',
]

[tool.hatch.build.targets.wheel]
packages = ["cutie"]

[project.urls]
"Homepage" = "https://github.com/hkchengrex/Cutie"
"Bug Tracker" = "https://github.com/hkchengrex/Cutie/issues"
